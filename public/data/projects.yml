projects:
  - name: Planned Obscelescence
    industry: Energy
    startDate: Jun 2024
    endDate: now
    role: Lead Developer
    teamSize: 2
    description: |-
      Following bulk migration of applications within the customer, now focussed on the applications needing more care for either business (and CNI) importance, complexity or size. Currently in architecture and design stages, working on multiple exploratory PoC's before bulding out the team to start build-out of IaC.
    shortDesc: |-
      More care intensive application IaC migrations from a mix of physical hardware into the cloud.
    technologies:
      - displayName: Terraform
        iconifyID: "devicon:terraform"
      - displayName: Azure
        iconifyID: "logos:microsoft-azure"
      - displayName: GitHub Actions
        iconifyID: "devicon:githubactions"
      - displayName: PowerShell
        iconifyID: "devicon:powershell"
      - displayName: Azure Devops
        iconifyID: "devicon:azuredevops"
  - name: Azure Migration Factory
    industry: Energy
    startDate: September 2021
    endDate: May 2024
    role: Lead Developer
    teamSize: 10
    description: |-
      Leadership of a team of devs to build a highly secure Migration Factory for a data-centre exit, mostly using Azure, GitHub, and terraform. Great focus put on saving future headaches and shipping great code that is easy to understand, consistent and can easily be adapted going forward. Overall successfully migrated near 40 applications with 1-5 servers per env, and 1-4 envs per application. Together we wrote the vast majority of the key terraform modules that are still actively consumed by the customer.
    shortDesc: |-
      Technical lead for up to 10 devs, delivering an IaC migration factory to support data centre exit.
    technologies:
      - displayName: Terraform
        iconifyID: "devicon:terraform"
      - displayName: Azure
        iconifyID: "logos:microsoft-azure"
      - displayName: GitHub Actions
        iconifyID: "devicon:githubactions"
      - displayName: PowerShell
        iconifyID: "devicon:powershell"
      - displayName: Azure Devops
        iconifyID: "devicon:azuredevops"
      - displayName: VMWare
        iconifyID: "devicon:vsphere"
  - name: Shared Services Platform
    industry: B2B Financial Services
    startDate: October 2020
    endDate: November 2021
    role: Senior Developer
    teamSize: 5
    description: |-
      A Kubernetes (AKS) platform for shared services and applications. In my role I was responsible for planning and implementing a Kubernetes platform on Azure to host shared services and required to support a new SaaS product from the development team. These features included Vault, Consul, Keycloak, Jenkins and Artifactory. A large degree of focus was placed on standardisation and automation to ensure the platform was easy to operate and maintain. To achieve this I designed a number of deployment patterns to facilitate workload identity, automated DNS and global load balancing.
    shortDesc: |-
      AKS deployment for shared services platform.
    technologies:
      - displayName: AKS
        iconifyID: "devicon:kubernetes"
      - displayName: Artifactory
        iconifyID: "logos:jfrog"
      - displayName: Azure
        iconifyID: "logos:microsoft-azure"
      - displayName: Consul
        iconifyID: "logos:consul"
      - displayName: Helm
        iconifyID: "logos:helm"
      - displayName: Ingress Nginx
        iconifyID: "logos:nginx"
      - displayName: Jenkins
        iconifyID: "vscode-icons:file-type-jenkins"
      - displayName: Terraform
        iconifyID: "devicon:terraform"
      - displayName: Vault
        iconifyID: "devicon:vault"
